---
plugin: netbox.netbox.nb_inventory
api_endpoint: http://192.168.127.147
token: "{{ netbox_token }}"
validate_certs: false

config_context: false

group_by:
  - device_roles
  - platforms
  - sites

query_filters:
  - status: active

compose:
  ansible_host: primary_ip4.address | regex_replace('/.*', '')
